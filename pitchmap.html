<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pitch Map">
<title>Pitch Map — ProCoach OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #faf8f2; }
  #app {
    --turf-deep:#1f3d1a; --turf-mid:#2c4d24; --turf-line:#3d6631;
    --chalk:#f4f1e8; --leather:#8c2f1f; --willow:#c9a66b; --ink:#1a2417;
    --paper:#faf8f2; --paper-dim:#eee9db;
    font-family:'Space Grotesk',sans-serif; background:var(--paper); color:var(--ink);
    min-height:100%; padding:10px; padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .pm-header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;padding-bottom:6px;border-bottom:3px double var(--turf-deep);}
  .pm-title{font-size:19px;font-weight:700;color:var(--turf-deep);letter-spacing:-0.01em;font-family:'Fraunces',serif;}
  .pm-subtitle{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--leather);font-weight:600;}
  .pm-inputs{display:flex;gap:6px;flex-wrap:wrap;}
  .pm-input{background:var(--paper);border:1.5px solid var(--turf-deep);border-radius:3px;padding:5px 7px;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--ink);}
  .pm-input:focus{outline:2px solid var(--leather);outline-offset:1px;}
  .pm-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .pm-seg{display:inline-flex;border:1.5px solid var(--turf-deep);border-radius:6px;overflow:hidden;}
  .pm-seg button{background:var(--paper);color:var(--turf-deep);border:none;padding:4px 9px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
  .pm-seg button.active{background:var(--turf-deep);color:var(--chalk);}
  .pm-over-indicator{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--leather);font-weight:600;}
  .pm-pitch-wrap{position:relative;background:linear-gradient(180deg,var(--turf-mid),var(--turf-deep));border-radius:10px;padding:8px;box-shadow:0 10px 30px -12px rgba(31,61,26,.5);height:min(72vh,760px);display:flex;justify-content:center;}
  .pm-pitch-svg{height:100%;width:auto;display:block;cursor:crosshair;border-radius:4px;touch-action:manipulation;}
  .pm-legend-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--ink);opacity:.75;font-family:'IBM Plex Mono',monospace;}
  .pm-legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
  .pm-chip-row{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;}
  .pm-chip{flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--paper);border:1.5px solid var(--turf-deep);color:var(--turf-deep);border-radius:14px;padding:4px 10px;cursor:pointer;}
  .pm-chip.active{background:var(--turf-deep);color:var(--chalk);}
  .pm-panel{background:var(--paper-dim);border:1px solid #d9d2bd;border-radius:8px;padding:12px 14px;margin-top:12px;}
  .pm-panel-title{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--turf-deep);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .pm-seam{border:none;height:1px;background:repeating-linear-gradient(90deg,var(--leather) 0 6px,transparent 6px 12px);margin:10px 0;}
  .pm-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .pm-stat{background:var(--paper);border:1px solid #d9d2bd;border-radius:6px;padding:6px 8px;text-align:center;}
  .pm-stat-val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--turf-deep);}
  .pm-stat-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#6b6350;margin-top:1px;}
  .pm-zone-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11.5px;}
  .pm-zone-label{width:78px;flex-shrink:0;color:#4a4536;}
  .pm-zone-bar-track{flex:1;height:7px;background:#e4ddc8;border-radius:4px;overflow:hidden;}
  .pm-zone-bar-fill{height:100%;background:var(--turf-line);border-radius:4px;}
  .pm-zone-count{width:16px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--turf-deep);}
  .pm-btn{display:inline-flex;align-items:center;gap:5px;background:var(--turf-deep);color:var(--chalk);border:none;border-radius:5px;padding:7px 11px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
  .pm-btn.secondary{background:var(--paper);color:var(--turf-deep);border:1.5px solid var(--turf-deep);}
  .pm-btn.danger{background:var(--paper);color:var(--leather);border:1.5px solid var(--leather);}
  .pm-btn:disabled{opacity:.45;}
  .pm-btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
  .pm-ball-list{max-height:200px;overflow-y:auto;}
  .pm-ball-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e4ddc8;font-size:11.5px;}
  .pm-ball-row:last-child{border-bottom:none;}
  .pm-ball-tag{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;}
  .pm-ball-swatch{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .pm-x-btn{background:none;border:none;color:#a19a80;cursor:pointer;padding:2px;font-size:14px;}
  .pm-popover{position:absolute;background:var(--paper);border:2px solid var(--turf-deep);border-radius:8px;padding:7px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;z-index:20;width:172px;}
  .pm-outcome-btn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;border:none;border-radius:4px;padding:6px 3px;cursor:pointer;color:#fff;}
  .pm-empty-hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:var(--chalk);opacity:.75;font-size:12px;font-style:italic;pointer-events:none;}
  .pm-status{font-size:11.5px;color:var(--leather);margin-top:6px;}
  .pm-load-list{max-height:260px;overflow-y:auto;}
  .pm-load-row{display:flex;justify-content:space-between;align-items:center;padding:8px;border:1px solid #d9d2bd;border-radius:6px;margin-bottom:6px;background:var(--paper);font-size:12px;}
  .pm-modal-backdrop{position:fixed;inset:0;background:rgba(20,20,10,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .pm-modal{background:var(--paper);border-radius:10px;padding:16px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var OUTCOMES = [
    { id:"dot", label:"Dot", runs:0, color:"#7d8a7a" },
    { id:"1", label:"1 run", runs:1, color:"#5b7a4f" },
    { id:"2", label:"2 runs", runs:2, color:"#5b7a4f" },
    { id:"3", label:"3 runs", runs:3, color:"#5b7a4f" },
    { id:"4", label:"FOUR", runs:4, color:"#2f6690" },
    { id:"6", label:"SIX", runs:6, color:"#b8860b" },
    { id:"W", label:"Wicket", runs:0, color:"#8c2f1f" },
    { id:"wd", label:"Wide", runs:1, color:"#c9a66b" },
    { id:"nb", label:"No ball", runs:1, color:"#c9a66b" },
  ];
  var outcomeMap = {}; OUTCOMES.forEach(function(o){ outcomeMap[o.id] = o; });

  var PITCH_LENGTH_M = 20.12;
  var LENGTH_ZONES = [
    { id:"yorker", label:"Yorker", from:0, to:1 },
    { id:"full", label:"Full", from:1, to:3 },
    { id:"good", label:"Good length", from:3, to:6 },
    { id:"short", label:"Short", from:6, to:9 },
    { id:"bouncer", label:"Bouncer", from:9, to:PITCH_LENGTH_M },
  ];
  var LINE_LABELS_RHB = ["Wide leg","Leg stump","Middle","Off stump","Wide off"];
  var LINE_LABELS_LHB = ["Wide off","Off stump","Middle","Leg stump","Wide leg"];
  var VB_W = 200, VB_H = 600;

  function lengthZoneFor(yPct){
    var d = (yPct/100)*PITCH_LENGTH_M;
    for (var i=0;i<LENGTH_ZONES.length;i++){ var z=LENGTH_ZONES[i]; if (d>=z.from && d<z.to) return z; }
    return LENGTH_ZONES[LENGTH_ZONES.length-1];
  }
  function lineColIndex(xPct){ return Math.min(4, Math.floor(xPct/20)); }
  function lineLabel(xPct, hand){ return (hand==="LHB"?LINE_LABELS_LHB:LINE_LABELS_RHB)[lineColIndex(xPct)]; }
  function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
  function uid(){ return Math.random().toString(36).slice(2,10); }

  function declutter(balls){
    var pts = balls.map(function(b){ return Object.assign({}, b, { x:(b.xPct/100)*VB_W, y:(b.yPct/100)*VB_H }); });
    var buckets = {};
    pts.forEach(function(b){
      var key = Math.round(b.x/13)+"_"+Math.round(b.y/13);
      (buckets[key] = buckets[key] || []).push(b);
    });
    var out = [];
    Object.keys(buckets).forEach(function(key){
      var group = buckets[key], n = group.length;
      var cx = group.reduce(function(s,g){return s+g.x;},0)/n;
      var cy = group.reduce(function(s,g){return s+g.y;},0)/n;
      group.forEach(function(b,i){
        if (n===1){ out.push(Object.assign({}, b, { dx:b.x, dy:b.y })); return; }
        var ring = Math.floor(i/7)+1;
        var posInRing = i%7;
        var countInRing = Math.min(7, n-Math.floor(i/7)*7);
        var angle = (2*Math.PI*posInRing)/countInRing - Math.PI/2;
        var r = 7.5*ring;
        out.push(Object.assign({}, b, {
          dx: clamp(cx + r*Math.cos(angle)*0.55, 5, VB_W-5),
          dy: clamp(cy + r*Math.sin(angle), 12, VB_H-12),
        }));
      });
    });
    return out;
  }
  function withOvers(balls){
    var legit = 0;
    return balls.map(function(b){
      var over = Math.floor(legit/6)+1, ballNo = (legit%6)+1;
      if (b.outcome!=="wd" && b.outcome!=="nb") legit++;
      return Object.assign({}, b, { over:over, ballNo:ballNo });
    });
  }

  var state = {
    bowler: "",
    sessionDate: new Date().toISOString().slice(0,10),
    hand: "RHB",
    balls: [],
    pending: null,
    viewMode: "dots",
    overFilter: "all",
    showLoad: false,
    status: "",
  };

  var app = document.getElementById("app");

  function savedSessionKeys(){
    var keys = [];
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf("pitchsession:")===0) keys.push(k);
    }
    keys.sort().reverse();
    return keys;
  }

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  function render(){
    var ballsWithOvers = withOvers(state.balls);
    var overNumbers = Array.from(new Set(ballsWithOvers.map(function(b){return b.over;}))).sort(function(a,b){return a-b;});
    var visibleBalls = state.overFilter==="all" ? ballsWithOvers : ballsWithOvers.filter(function(b){return b.over===state.overFilter;});
    var decluttered = declutter(visibleBalls);

    var statBalls = visibleBalls;
    var legit = statBalls.filter(function(b){return b.outcome!=="wd" && b.outcome!=="nb";});
    var totalRuns = statBalls.reduce(function(s,b){return s+outcomeMap[b.outcome].runs;},0);
    var wickets = statBalls.filter(function(b){return b.outcome==="W";}).length;
    var dots = statBalls.filter(function(b){return b.outcome==="dot";}).length;
    var boundaries = statBalls.filter(function(b){return b.outcome==="4"||b.outcome==="6";}).length;
    var economy = legit.length ? (totalRuns/legit.length)*6 : 0;
    var dotPct = legit.length ? (dots/legit.length)*100 : 0;

    var lengthCounts = LENGTH_ZONES.map(function(z){
      return Object.assign({}, z, { count: statBalls.filter(function(b){return lengthZoneFor(b.yPct).id===z.id;}).length });
    });
    var lineLabels = state.hand==="LHB" ? LINE_LABELS_LHB : LINE_LABELS_RHB;
    var lineCounts = lineLabels.map(function(label,i){
      return { label:label, count: statBalls.filter(function(b){return lineColIndex(b.xPct)===i;}).length };
    });
    var maxLengthCount = Math.max.apply(null, [1].concat(lengthCounts.map(function(z){return z.count;})));
    var maxLineCount = Math.max.apply(null, [1].concat(lineCounts.map(function(z){return z.count;})));

    var heatGrid = [];
    LENGTH_ZONES.forEach(function(lz){
      for (var ci=0; ci<5; ci++){
        var count = visibleBalls.filter(function(b){return lengthZoneFor(b.yPct).id===lz.id && lineColIndex(b.xPct)===ci;}).length;
        heatGrid.push({ ci:ci, count:count, lz:lz });
      }
    });
    var maxHeat = Math.max.apply(null, [1].concat(heatGrid.map(function(c){return c.count;})));

    var lastLegit = legit.length;
    var oversDone = Math.floor(lastLegit/6), ballIntoOver = lastLegit%6;

    var html = "";
    html += '<div class="pm-header">';
    html += '<div><div class="pm-subtitle">ProCoach OS &middot; Bowling Analysis</div><div class="pm-title">Pitch Map</div></div>';
    html += '<div class="pm-inputs">';
    html += '<input class="pm-input" id="input-bowler" placeholder="Bowler name" style="width:130px" value="'+esc(state.bowler)+'">';
    html += '<input class="pm-input" id="input-date" type="date" value="'+esc(state.sessionDate)+'">';
    html += '</div></div>';

    html += '<div class="pm-toolbar"><div style="display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<div class="pm-seg"><button data-action="set-hand" data-hand="RHB" class="'+(state.hand==="RHB"?"active":"")+'">RHB</button><button data-action="set-hand" data-hand="LHB" class="'+(state.hand==="LHB"?"active":"")+'">LHB</button></div>';
    html += '<div class="pm-seg"><button data-action="set-view" data-view="dots" class="'+(state.viewMode==="dots"?"active":"")+'">Dots</button><button data-action="set-view" data-view="heat" class="'+(state.viewMode==="heat"?"active":"")+'">Heat grid</button></div>';
    html += '</div><div class="pm-over-indicator">Ov '+oversDone+'.'+ballIntoOver+' &middot; '+statBalls.length+' balls</div></div>';

    if (overNumbers.length>1){
      html += '<div class="pm-chip-row"><button class="pm-chip '+(state.overFilter==="all"?"active":"")+'" data-action="set-over" data-over="all">All overs</button>';
      overNumbers.forEach(function(n){ html += '<button class="pm-chip '+(state.overFilter===n?"active":"")+'" data-action="set-over" data-over="'+n+'">Ov '+n+'</button>'; });
      html += '</div>';
    }

    html += '<div class="pm-pitch-wrap" id="pitch-wrap"><svg id="pitch-svg" viewBox="0 0 '+VB_W+' '+VB_H+'" class="pm-pitch-svg">';
    LENGTH_ZONES.forEach(function(z,i){
      var y1=(z.from/PITCH_LENGTH_M)*VB_H, y2=(z.to/PITCH_LENGTH_M)*VB_H;
      html += '<rect x="0" y="'+y1+'" width="'+VB_W+'" height="'+(y2-y1)+'" fill="'+(i%2===0?"rgba(244,241,232,0.045)":"rgba(244,241,232,0)")+'"/>';
    });
    [1,2,3,4].forEach(function(i){ html += '<line x1="'+(i*40)+'" y1="0" x2="'+(i*40)+'" y2="'+VB_H+'" stroke="rgba(244,241,232,0.12)" stroke-width="1" stroke-dasharray="3 5"/>'; });
    LENGTH_ZONES.forEach(function(z){
      var y=(z.from/PITCH_LENGTH_M)*VB_H;
      if (z.from>0) html += '<line x1="0" y1="'+y+'" x2="'+VB_W+'" y2="'+y+'" stroke="rgba(244,241,232,0.15)" stroke-width="1"/>';
      html += '<text x="4" y="'+(((z.from+z.to)/2/PITCH_LENGTH_M)*VB_H)+'" fill="rgba(244,241,232,0.5)" font-size="9" font-family="IBM Plex Mono, monospace">'+z.label+'</text>';
    });
    html += '<rect x="1" y="1" width="'+(VB_W-2)+'" height="'+(VB_H-2)+'" fill="none" stroke="rgba(244,241,232,0.4)" stroke-width="2"/>';
    html += '<line x1="0" y1="18" x2="'+VB_W+'" y2="18" stroke="#f4f1e8" stroke-width="2.5"/>';
    html += '<line x1="0" y1="'+(VB_H-18)+'" x2="'+VB_W+'" y2="'+(VB_H-18)+'" stroke="#f4f1e8" stroke-width="2.5"/>';
    [85,100,115].forEach(function(x){ html += '<rect x="'+(x-1.5)+'" y="4" width="3" height="14" fill="#e8dcb8"/>'; });
    [85,100,115].forEach(function(x){ html += '<rect x="'+(x-1.5)+'" y="'+(VB_H-18)+'" width="3" height="14" fill="#e8dcb8"/>'; });
    html += '<text x="'+(VB_W/2)+'" y="34" text-anchor="middle" fill="rgba(244,241,232,0.55)" font-size="9" letter-spacing="1.5" font-family="IBM Plex Mono, monospace">BATTER</text>';
    html += '<text x="'+(VB_W/2)+'" y="'+(VB_H-26)+'" text-anchor="middle" fill="rgba(244,241,232,0.55)" font-size="9" letter-spacing="1.5" font-family="IBM Plex Mono, monospace">BOWLER</text>';

    if (state.viewMode==="heat"){
      heatGrid.forEach(function(cell){
        var y1=(cell.lz.from/PITCH_LENGTH_M)*VB_H, y2=(cell.lz.to/PITCH_LENGTH_M)*VB_H;
        var t = cell.count/maxHeat;
        html += '<rect x="'+(cell.ci*40)+'" y="'+y1+'" width="40" height="'+(y2-y1)+'" fill="'+(cell.count?("rgba(140,47,31,"+(0.12+t*0.68)+")"):"transparent")+'" stroke="rgba(244,241,232,0.08)"/>';
        if (cell.count>0) html += '<text x="'+(cell.ci*40+20)+'" y="'+((y1+y2)/2+4)+'" text-anchor="middle" font-size="13" font-family="IBM Plex Mono, monospace" fill="#f4f1e8" font-weight="600">'+cell.count+'</text>';
      });
    } else {
      decluttered.forEach(function(b){
        var o = outcomeMap[b.outcome];
        var big = o.id==="4"||o.id==="6"||o.id==="W";
        html += '<circle cx="'+b.dx+'" cy="'+b.dy+'" r="'+(big?7:5.5)+'" fill="'+o.color+'" stroke="#faf8f2" stroke-width="1.2" opacity="0.92"/>';
      });
    }
    if (state.pending) html += '<circle cx="'+((state.pending.xPct/100)*VB_W)+'" cy="'+((state.pending.yPct/100)*VB_H)+'" r="7" fill="none" stroke="#f4f1e8" stroke-width="1.5" stroke-dasharray="2 2"/>';
    html += '</svg>';
    if (state.balls.length===0 && !state.pending) html += '<div class="pm-empty-hint">Tap anywhere on the pitch to plot a ball</div>';

    if (state.pending){
      var POP_W=172, POP_H=116, p=state.pending;
      var left = p.px+12, top = p.py+12;
      if (left+POP_W > p.wrapW-6) left = p.px-POP_W-12;
      if (top+POP_H > p.wrapH-6) top = p.py-POP_H-12;
      left = clamp(left, 4, Math.max(4, p.wrapW-POP_W-4));
      top = clamp(top, 4, Math.max(4, p.wrapH-POP_H-4));
      html += '<div class="pm-popover" style="left:'+left+'px;top:'+top+'px;">';
      OUTCOMES.forEach(function(o){ html += '<button class="pm-outcome-btn" style="background:'+o.color+'" data-action="commit-outcome" data-outcome="'+o.id+'">'+o.label+'</button>'; });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="pm-legend-row">';
    OUTCOMES.forEach(function(o){ html += '<span><span class="pm-legend-dot" style="background:'+o.color+'"></span>'+o.label+'</span>'; });
    html += '</div>';

    html += '<div class="pm-btn-row">';
    html += '<button class="pm-btn" data-action="save">Save session</button>';
    html += '<button class="pm-btn secondary" data-action="load-open">Load</button>';
    html += '<button class="pm-btn secondary" data-action="export">Export JSON</button>';
    html += '<button class="pm-btn secondary" data-action="undo" '+(state.balls.length?"":"disabled")+'>Undo</button>';
    html += '<button class="pm-btn danger" data-action="clear" '+(state.balls.length?"":"disabled")+'>Clear</button>';
    html += '</div>';
    if (state.status) html += '<div class="pm-status">'+esc(state.status)+'</div>';

    html += '<div class="pm-panel"><div class="pm-panel-title">Summary'+(state.overFilter!=="all"?(" &middot; Over "+state.overFilter):"")+'</div>';
    html += '<div class="pm-stat-grid">';
    [["Balls",statBalls.length],["Runs",totalRuns],["Wickets",wickets],["Economy",economy.toFixed(1)],["Dot ball",dotPct.toFixed(0)+"%"],["Boundaries",boundaries]].forEach(function(s){
      html += '<div class="pm-stat"><div class="pm-stat-val">'+s[1]+'</div><div class="pm-stat-label">'+s[0]+'</div></div>';
    });
    html += '</div><div class="pm-seam"></div><div class="pm-panel-title" style="font-size:12.5px">Length</div>';
    lengthCounts.forEach(function(z){
      html += '<div class="pm-zone-row"><div class="pm-zone-label">'+z.label+'</div><div class="pm-zone-bar-track"><div class="pm-zone-bar-fill" style="width:'+((z.count/maxLengthCount)*100)+'%"></div></div><div class="pm-zone-count">'+z.count+'</div></div>';
    });
    html += '<div class="pm-seam"></div><div class="pm-panel-title" style="font-size:12.5px">Line ('+(state.hand==="LHB"?"left-hand":"right-hand")+" batter's view)"+'</div>';
    lineCounts.forEach(function(z){
      html += '<div class="pm-zone-row"><div class="pm-zone-label">'+z.label+'</div><div class="pm-zone-bar-track"><div class="pm-zone-bar-fill" style="width:'+((z.count/maxLineCount)*100)+'%"></div></div><div class="pm-zone-count">'+z.count+'</div></div>';
    });
    html += '</div>';

    html += '<div class="pm-panel"><div class="pm-panel-title">Ball log</div>';
    if (state.balls.length===0) html += '<div style="font-size:12px;color:#8a836c">No balls plotted yet.</div>';
    html += '<div class="pm-ball-list">';
    ballsWithOvers.forEach(function(b){
      var o = outcomeMap[b.outcome], lz = lengthZoneFor(b.yPct), ln = lineLabel(b.xPct, state.hand);
      html += '<div class="pm-ball-row"><span class="pm-ball-tag"><span class="pm-ball-swatch" style="background:'+o.color+'"></span>'+b.over+'.'+b.ballNo+' '+o.label+' &mdash; '+lz.label+', '+ln+'</span><button class="pm-x-btn" data-action="remove-ball" data-id="'+b.id+'">&times;</button></div>';
    });
    html += '</div></div>';

    if (state.showLoad){
      var keys = savedSessionKeys();
      html += '<div class="pm-modal-backdrop" data-action="load-close"><div class="pm-modal" onclick="event.stopPropagation()"><div class="pm-panel-title">Saved sessions</div><div class="pm-load-list">';
      if (keys.length===0) html += '<div style="font-size:12px;color:#8a836c">Nothing saved yet.</div>';
      keys.forEach(function(k){
        var parts = k.split(":"); var name = (parts[1]||k).replace(/-/g," "); var date = parts[2]||"";
        html += '<div class="pm-load-row"><span>'+esc(name)+' &middot; '+esc(date)+'</span><span style="display:flex;gap:6px;"><button class="pm-btn secondary" style="padding:4px 8px" data-action="load-session" data-key="'+esc(k)+'">Load</button><button class="pm-x-btn" data-action="delete-session" data-key="'+esc(k)+'">&#128465;</button></span></div>';
      });
      html += '</div><div style="margin-top:10px;text-align:right"><button class="pm-btn secondary" data-action="load-close">Close</button></div></div></div>';
    }

    app.innerHTML = html;

    var bowlerInput = document.getElementById("input-bowler");
    bowlerInput.addEventListener("input", function(){ state.bowler = bowlerInput.value; });
    var dateInput = document.getElementById("input-date");
    dateInput.addEventListener("input", function(){ state.sessionDate = dateInput.value; });

    var svg = document.getElementById("pitch-svg");
    svg.addEventListener("click", function(e){
      var wrap = document.getElementById("pitch-wrap");
      var svgRect = svg.getBoundingClientRect();
      var wrapRect = wrap.getBoundingClientRect();
      var xPct = clamp(((e.clientX-svgRect.left)/svgRect.width)*100, 0, 100);
      var yPct = clamp(((e.clientY-svgRect.top)/svgRect.height)*100, 0, 100);
      state.pending = { xPct:xPct, yPct:yPct, px:e.clientX-wrapRect.left, py:e.clientY-wrapRect.top, wrapW:wrapRect.width, wrapH:wrapRect.height };
      render();
    });
  }

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action==="set-hand"){ state.hand = el.getAttribute("data-hand"); render(); }
    else if (action==="set-view"){ state.viewMode = el.getAttribute("data-view"); render(); }
    else if (action==="set-over"){ var v = el.getAttribute("data-over"); state.overFilter = v==="all"?"all":Number(v); render(); }
    else if (action==="commit-outcome"){
      if (state.pending){
        state.balls.push({ id:uid(), xPct:state.pending.xPct, yPct:state.pending.yPct, outcome:el.getAttribute("data-outcome"), t:Date.now() });
        state.pending = null; render();
      }
    }
    else if (action==="remove-ball"){ var id = el.getAttribute("data-id"); state.balls = state.balls.filter(function(b){return b.id!==id;}); render(); }
    else if (action==="undo"){ state.balls = state.balls.slice(0,-1); render(); }
    else if (action==="clear"){ if (state.balls.length && confirm("Clear all balls for this session?")){ state.balls = []; render(); } }
    else if (action==="save"){
      if (!state.bowler.trim()){ state.status = "Add a bowler name before saving."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); return; }
      var key = "pitchsession:"+state.bowler.trim().toLowerCase().replace(/\s+/g,"-")+":"+state.sessionDate+":"+Date.now();
      var payload = { bowler: state.bowler.trim(), date: state.sessionDate, hand: state.hand, balls: state.balls, savedAt: Date.now() };
      try { localStorage.setItem(key, JSON.stringify(payload)); state.status = "Session saved."; }
      catch(err){ state.status = "Couldn't save — try again."; }
      render(); setTimeout(function(){ state.status=""; render(); }, 2500);
    }
    else if (action==="load-open"){ state.showLoad = true; render(); }
    else if (action==="load-close"){ state.showLoad = false; render(); }
    else if (action==="load-session"){
      var key = el.getAttribute("data-key");
      try {
        var data = JSON.parse(localStorage.getItem(key));
        state.bowler = data.bowler||""; state.sessionDate = data.date||state.sessionDate;
        state.hand = data.hand||"RHB"; state.balls = data.balls||[]; state.showLoad = false;
      } catch(err){ state.status = "Couldn't load that session."; }
      render();
    }
    else if (action==="delete-session"){ localStorage.removeItem(el.getAttribute("data-key")); render(); }
    else if (action==="export"){
      var payload = { bowler: state.bowler.trim(), date: state.sessionDate, hand: state.hand, balls: state.balls, exportedAt: new Date().toISOString() };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "pitchmap-"+((state.bowler.trim()||"bowler").replace(/\s+/g,"-").toLowerCase())+"-"+state.sessionDate+".json";
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }
  });

  render();
})();
</script>
</body>
</html>
