<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pitch Map">
<meta name="theme-color" content="#0a1420">
<title>Pitch Map — ProCoach OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0a1420; }
  #app {
    --bg:#0a1420; --card:#111d30; --card-border:rgba(255,255,255,0.07);
    --accent:#22c58b; --accent-dim:rgba(34,197,139,0.16); --accent-strong:#1bb37e;
    --text:#eef2f6; --text-dim:#8b96a5; --danger:#ff6b52;
    --turf-deep:#173d20; --turf-mid:#204d29;
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
    min-height:100%; padding:10px;
    padding-top: max(14px, env(safe-area-inset-top));
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  .pm-display{font-family:'Poppins',sans-serif;}
  .pm-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .pm-title{font-size:19px;font-weight:800;color:var(--accent);letter-spacing:-0.01em;font-family:'Poppins',sans-serif;}
  .pm-subtitle{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);font-weight:600;}

  .pm-bowler-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;}
  .pm-tab{flex-shrink:0;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--card-border);color:var(--text-dim);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:36px;}
  .pm-tab.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .pm-tab.add{color:var(--accent);border:1px dashed var(--accent);background:transparent;}

  .pm-name-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .pm-input{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:9px 12px;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--text);min-height:38px;}
  .pm-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .pm-input.grow{flex:1;}
  .pm-input-date{width:130px;}
  .pm-link-btn{background:none;border:none;color:var(--danger);font-size:11.5px;font-family:'Inter',sans-serif;cursor:pointer;padding:8px 4px;white-space:nowrap;}

  .pm-mode-tabs{display:flex;gap:8px;margin-bottom:6px;}
  .pm-mode-tab{flex:1;text-align:center;background:var(--card);border:1px solid var(--card-border);color:var(--text-dim);border-radius:12px;padding:9px 6px;font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
  .pm-mode-tab.active{background:var(--accent);color:#04140d;border-color:var(--accent);}

  .pm-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .pm-seg{display:inline-flex;border:1px solid var(--card-border);border-radius:999px;overflow:hidden;background:var(--card);}
  .pm-seg button{background:transparent;color:var(--text-dim);border:none;padding:8px 12px;font-size:11.5px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;min-height:36px;}
  .pm-seg button.active{background:var(--accent);color:#04140d;}
  .pm-over-indicator{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);font-weight:600;}

  .pm-pitch-wrap{position:relative;background:linear-gradient(180deg,var(--turf-mid),var(--turf-deep));border-radius:20px;padding:10px;height:min(74vh,860px);display:flex;justify-content:center;align-items:center;border:1px solid var(--card-border);overflow:hidden;}
  .pm-pitch-svg{height:100%;width:auto;display:block;cursor:crosshair;border-radius:8px;touch-action:manipulation;}
  .pm-ground-svg{width:100%;height:100%;display:block;cursor:crosshair;touch-action:manipulation;}
  .pm-corner-btn{position:absolute;top:8px;right:8px;z-index:15;}
  .pm-mark-btn-wrap{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;z-index:15;}
  .pm-legend-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px;font-size:10.5px;color:var(--text-dim);font-family:'Inter',sans-serif;}
  .pm-legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}

  .pm-chip-row{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;-webkit-overflow-scrolling:touch;}
  .pm-chip{flex-shrink:0;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;background:var(--card);border:1px solid var(--card-border);color:var(--text-dim);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:34px;}
  .pm-chip.active{background:var(--accent);color:#04140d;border-color:var(--accent);}

  .pm-panel{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:14px 16px;margin-top:12px;}
  .pm-panel-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
  .pm-panel-title .dim{color:var(--text-dim);font-weight:500;font-size:12px;}
  .pm-seam{border:none;height:1px;background:var(--card-border);margin:12px 0;}
  .pm-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pm-stat{background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:12px;padding:10px 8px;text-align:center;}
  .pm-stat-val{font-family:'Poppins',sans-serif;font-size:19px;font-weight:800;color:var(--accent);}
  .pm-stat-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-top:2px;}
  .pm-zone-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
  .pm-zone-label{width:112px;flex-shrink:0;color:var(--text-dim);font-size:11px;}
  .pm-zone-bar-track{flex:1;height:7px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;}
  .pm-zone-bar-fill{height:100%;background:var(--accent);border-radius:4px;}
  .pm-zone-count{width:18px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--text);}

  .pm-ot-table{border-collapse:collapse;width:100%;font-size:11px;font-family:'IBM Plex Mono',monospace;}
  .pm-ot-table th{padding:4px 5px;text-align:center;font-weight:700;white-space:nowrap;}
  .pm-ot-table td{padding:5px 4px;text-align:center;border-top:1px solid var(--card-border);border-radius:4px;}
  .pm-ot-table .pm-ot-label{text-align:left;white-space:nowrap;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:11px;padding-right:8px;}

  .pm-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#04140d;border:none;border-radius:999px;padding:10px 15px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;min-height:40px;touch-action:manipulation;}
  .pm-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--card-border);}
  .pm-btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--danger);}
  .pm-btn.small{padding:6px 11px;min-height:30px;font-size:11px;}
  .pm-btn:disabled{opacity:.4;}
  .pm-btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .pm-ball-list{max-height:220px;overflow-y:auto;}
  .pm-ball-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--card-border);font-size:12px;}
  .pm-ball-row:last-child{border-bottom:none;}
  .pm-ball-tag{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;color:var(--text);}
  .pm-ball-swatch{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .pm-x-btn{background:rgba(255,255,255,0.06);border:none;color:var(--text-dim);cursor:pointer;padding:6px 10px;font-size:14px;border-radius:8px;min-height:32px;min-width:32px;touch-action:manipulation;}
  .pm-x-btn:active{color:var(--danger);}

  .pm-popover{position:absolute;background:var(--card);border:1.5px solid var(--accent);border-radius:12px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;z-index:20;width:186px;}
  .pm-outcome-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;border:none;border-radius:6px;padding:9px 4px;cursor:pointer;color:#04140d;min-height:36px;touch-action:manipulation;}

  .pm-empty-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(244,241,232,0.85);font-size:12px;font-style:italic;pointer-events:none;padding:0 12px;}
  .pm-status{font-size:12px;color:var(--accent);margin-top:8px;}
  .pm-load-list{max-height:260px;overflow-y:auto;}
  .pm-load-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--card-border);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,0.02);font-size:12.5px;}
  .pm-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .pm-modal{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto;}

  #print-report{display:none;}
  @media print {
    body * { visibility: hidden; }
    #print-report, #print-report * { visibility: visible; }
    #print-report{ display:block; position:absolute; left:0; top:0; width:100%; background:#fff; color:#141414; font-family:Arial,Helvetica,sans-serif; }
    .pr-bowler{ padding:18px 22px; page-break-after:always; }
    .pr-bowler:last-child{ page-break-after:auto; }
    .pr-head{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #173d20; padding-bottom:8px; margin-bottom:12px; }
    .pr-head h1{ font-size:18px; margin:0; color:#173d20; }
    .pr-head .pr-meta{ font-size:11px; color:#555; }
    .pr-charts{ display:flex; gap:18px; align-items:flex-start; margin-bottom:14px; }
    .pr-charts svg{ max-height:280px; width:auto; }
    .pr-stats{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .pr-stat{ border:1px solid #ccc; border-radius:6px; padding:6px 10px; font-size:11px; text-align:center; min-width:64px; }
    .pr-stat b{ display:block; font-size:15px; color:#173d20; }
    .pr-table{ width:100%; border-collapse:collapse; font-size:10.5px; margin-bottom:10px; }
    .pr-table th, .pr-table td{ border:1px solid #ccc; padding:3px 6px; text-align:left; }
    .pr-table th{ background:#eef2f6; }
    .pr-section-title{ font-size:12.5px; font-weight:700; color:#173d20; margin:10px 0 4px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-report"></div>
<script>
(function(){
  var OUTCOMES = [
    { id:"dot", label:"Dot", runs:0, color:"#7d93a3" },
    { id:"1", label:"1 run", runs:1, color:"#4fb87a" },
    { id:"2", label:"2 runs", runs:2, color:"#2ec4c4" },
    { id:"3", label:"3 runs", runs:3, color:"#c9793d" },
    { id:"4", label:"FOUR", runs:4, color:"#3d8bd6" },
    { id:"6", label:"SIX", runs:6, color:"#e0ab2c" },
    { id:"W", label:"Wicket", runs:0, color:"#ff6b52" },
    { id:"wd", label:"Wide", runs:1, color:"#b98ce0" },
    { id:"nb", label:"No ball", runs:1, color:"#b98ce0" },
  ];
  var outcomeMap = {}; OUTCOMES.forEach(function(o){ outcomeMap[o.id] = o; });
  outcomeMap["_none"] = { id:"_none", label:"Pitched (no outcome)", runs:0, color:"#eef2f6" };
  var DISMISSAL_TYPES = ["Bowled","Caught","LBW","Stumped","Run out","Hit wicket","Other"];
  var FILTERABLE = OUTCOMES.map(function(o){return o.id;}).concat(["_none"]);

  var PITCH_LENGTH_M = 20.12;
  var LENGTH_ZONES = [
    { id:"yorker", label:"Yorker", from:0, to:1 },
    { id:"full", label:"Full", from:1, to:3 },
    { id:"good", label:"Good length", from:3, to:6 },
    { id:"short", label:"Short", from:6, to:9 },
    { id:"bouncer", label:"Bouncer", from:9, to:PITCH_LENGTH_M },
  ];
  // stump-anchored line zones (stumps drawn at x=86/100/114 in the SVG); left=off, right=leg for RHB
  var LINE_ZONES = [
    { from:0,   to:58  },
    { from:58,  to:79  },
    { from:79,  to:93  },
    { from:93,  to:107 },
    { from:107, to:121 },
    { from:121, to:142 },
    { from:142, to:200 },
  ];
  var LINE_LABELS_RHB = ["Outside off","Just outside off","Off","Middle","Leg","Just outside leg","Outside leg"];
  var LINE_LABELS_LHB = ["Outside leg","Just outside leg","Leg","Middle","Off","Just outside off","Outside off"];
  var VB_W = 200, VB_H = 600, RULER_W = 36, VB_W_TOTAL = VB_W + RULER_W;
  var POPPING_CREASE_M = 1.22, CREASE_HALF_W = 23;
  // ground (full field) for the combined outcomes + wagon wheel view — representational, not to scale
  var GW_SIZE = 320, GW_CX = 160, GW_CY = 160, GW_R = 144, GW_INNER_R = 61;
  var MINI_PITCH_LEN = 50, MINI_PITCH_W = 15;
  var BAT_Y = GW_CY - MINI_PITCH_LEN/2; // batter sits at the top of a pitch centered in the ground

  function lengthMeters(yPct){ return (yPct/100)*PITCH_LENGTH_M; }
  function lengthZoneFor(yPct){
    var d = lengthMeters(yPct);
    for (var i=0;i<LENGTH_ZONES.length;i++){ var z=LENGTH_ZONES[i]; if (d>=z.from && d<z.to) return z; }
    return LENGTH_ZONES[LENGTH_ZONES.length-1];
  }
  function lineZoneIndex(xPct){
    var x = (xPct/100)*VB_W;
    for (var i=0;i<LINE_ZONES.length;i++){ if (x>=LINE_ZONES[i].from && x<LINE_ZONES[i].to) return i; }
    return LINE_ZONES.length-1;
  }
  function lineLabel(xPct, hand){ return (hand==="LHB"?LINE_LABELS_LHB:LINE_LABELS_RHB)[lineZoneIndex(xPct)]; }
  function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function hasWagon(b){ return b.wagonX!==null && b.wagonX!==undefined; }

  function declutterPitch(balls){
    var pts = balls.map(function(b){ return Object.assign({}, b, { x:(b.xPct/100)*VB_W, y:(b.yPct/100)*VB_H }); });
    var buckets = {};
    pts.forEach(function(b){
      var key = Math.round(b.x/13)+"_"+Math.round(b.y/13);
      (buckets[key] = buckets[key] || []).push(b);
    });
    var out = [];
    Object.keys(buckets).forEach(function(key){
      var group = buckets[key], n = group.length;
      var cx = group.reduce(function(s,g){return s+g.x;},0)/n;
      var cy = group.reduce(function(s,g){return s+g.y;},0)/n;
      group.forEach(function(b,i){
        if (n===1){ out.push(Object.assign({}, b, { dx:b.x, dy:b.y })); return; }
        var ring = Math.floor(i/7)+1;
        var posInRing = i%7;
        var countInRing = Math.min(7, n-Math.floor(i/7)*7);
        var angle = (2*Math.PI*posInRing)/countInRing - Math.PI/2;
        var r = 7.5*ring;
        out.push(Object.assign({}, b, {
          dx: clamp(cx + r*Math.cos(angle)*0.55, 5, VB_W-5),
          dy: clamp(cy + r*Math.sin(angle), 14, VB_H-14),
        }));
      });
    });
    return out;
  }
  function withOvers(balls){
    var legit = 0;
    return balls.map(function(b){
      var over = Math.floor(legit/6)+1, ballNo = (legit%6)+1;
      if (b.outcome!=="wd" && b.outcome!=="nb") legit++;
      return Object.assign({}, b, { over:over, ballNo:ballNo });
    });
  }
  function statsFor(balls){
    var legit = balls.filter(function(b){return b.outcome!=="wd" && b.outcome!=="nb";});
    var totalRuns = balls.reduce(function(s,b){return s+outcomeMap[b.outcome].runs;},0);
    var wickets = balls.filter(function(b){return b.outcome==="W";}).length;
    var dots = balls.filter(function(b){return b.outcome==="dot";}).length;
    var boundaries = balls.filter(function(b){return b.outcome==="4"||b.outcome==="6";}).length;
    var economy = legit.length ? (totalRuns/legit.length)*6 : 0;
    var dotPct = legit.length ? (dots/legit.length)*100 : 0;
    return { legit:legit, totalRuns:totalRuns, wickets:wickets, dots:dots, boundaries:boundaries, economy:economy, dotPct:dotPct };
  }

  function popoverStyle(p, POP_W, POP_H){
    var left = p.px+12, top = p.py+12;
    if (left+POP_W > p.wrapW-6) left = p.px-POP_W-12;
    if (top+POP_H > p.wrapH-6) top = p.py-POP_H-12;
    left = clamp(left, 4, Math.max(4, p.wrapW-POP_W-4));
    top = clamp(top, 4, Math.max(4, p.wrapH-POP_H-4));
    return { left:left, top:top };
  }

  // ---------- detailed pitch map (ruler, turf bands, crease box, stumps, dots) ----------
  function pitchCoreMarkup(viewMode, balls, drawDots){
    var html = "";
    for (var m=0; m<=20; m++){
      var ry = (m/PITCH_LENGTH_M)*VB_H;
      var major = m%2===0;
      html += '<line x1="'+(major?-14:-9)+'" y1="'+ry+'" x2="-2" y2="'+ry+'" stroke="rgba(238,242,246,'+(major?0.55:0.28)+')" stroke-width="'+(major?1.2:0.8)+'"/>';
      if (major) html += '<text x="-18" y="'+(ry+3)+'" text-anchor="end" font-size="8" font-family="IBM Plex Mono, monospace" fill="rgba(238,242,246,0.75)">'+m+'m</text>';
    }
    html += '<line x1="-2" y1="0" x2="-2" y2="'+VB_H+'" stroke="rgba(238,242,246,0.3)" stroke-width="1"/>';
    LENGTH_ZONES.forEach(function(z,i){
      var y1=(z.from/PITCH_LENGTH_M)*VB_H, y2=(z.to/PITCH_LENGTH_M)*VB_H;
      html += '<rect x="0" y="'+y1+'" width="'+VB_W+'" height="'+(y2-y1)+'" fill="'+(i%2===0?"rgba(244,241,232,0.045)":"rgba(244,241,232,0)")+'"/>';
    });
    [58,79,93,107,121,142].forEach(function(x){ html += '<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+VB_H+'" stroke="rgba(244,241,232,'+((x===93||x===107)?0.22:0.12)+')" stroke-width="1" stroke-dasharray="3 5"/>'; });
    LENGTH_ZONES.forEach(function(z){
      var y=(z.from/PITCH_LENGTH_M)*VB_H;
      if (z.from>0) html += '<line x1="0" y1="'+y+'" x2="'+VB_W+'" y2="'+y+'" stroke="rgba(244,241,232,0.15)" stroke-width="1"/>';
      html += '<text x="4" y="'+(((z.from+z.to)/2/PITCH_LENGTH_M)*VB_H)+'" fill="rgba(244,241,232,0.5)" font-size="9" font-family="IBM Plex Mono, monospace">'+z.label+'</text>';
    });
    var poppingYTop = (POPPING_CREASE_M / PITCH_LENGTH_M) * VB_H;
    var poppingYBottom = VB_H - poppingYTop;
    var cxL = 100 - CREASE_HALF_W, cxR = 100 + CREASE_HALF_W;
    html += '<line x1="'+cxL+'" y1="0" x2="'+cxR+'" y2="0" stroke="#f4f1e8" stroke-width="2.5"/>';
    html += '<line x1="'+cxL+'" y1="'+VB_H+'" x2="'+cxR+'" y2="'+VB_H+'" stroke="#f4f1e8" stroke-width="2.5"/>';
    html += '<line x1="0" y1="'+poppingYTop+'" x2="'+VB_W+'" y2="'+poppingYTop+'" stroke="#f4f1e8" stroke-width="2"/>';
    html += '<line x1="0" y1="'+poppingYBottom+'" x2="'+VB_W+'" y2="'+poppingYBottom+'" stroke="#f4f1e8" stroke-width="2"/>';
    html += '<line x1="'+cxL+'" y1="0" x2="'+cxL+'" y2="'+poppingYTop+'" stroke="#f4f1e8" stroke-width="1.5" stroke-dasharray="1 2.5"/>';
    html += '<line x1="'+cxR+'" y1="0" x2="'+cxR+'" y2="'+poppingYTop+'" stroke="#f4f1e8" stroke-width="1.5" stroke-dasharray="1 2.5"/>';
    html += '<line x1="'+cxL+'" y1="'+VB_H+'" x2="'+cxL+'" y2="'+poppingYBottom+'" stroke="#f4f1e8" stroke-width="1.5" stroke-dasharray="1 2.5"/>';
    html += '<line x1="'+cxR+'" y1="'+VB_H+'" x2="'+cxR+'" y2="'+poppingYBottom+'" stroke="#f4f1e8" stroke-width="1.5" stroke-dasharray="1 2.5"/>';
    [0, 1].forEach(function(idx){
      var stumpY = idx===0 ? 0 : VB_H - 16;
      [86,100,114].forEach(function(x){
        html += '<rect x="'+(x-2.4)+'" y="'+stumpY+'" width="4.8" height="16" rx="1.5" fill="#f2c14e" stroke="#3d2a12" stroke-width="1.1"/>';
      });

  // ---------- IndexedDB (shared "procoachos" database across pitchmap / battingmap / insights) ----------
  var DB_STORE = "pitchsessions", LEGACY_PREFIX = "pitchsession:";
  function dbOpen(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open("procoachos", 2);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains("pitchsessions")) db.createObjectStore("pitchsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("battingsessions")) db.createObjectStore("battingsessions", { keyPath:"key" });
        if (!db.objectStoreNames.contains("bowlerprofiles")) db.createObjectStore("bowlerprofiles", { keyPath:"key" });
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function dbGetAll(){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readonly");
        var req = tx.objectStore(DB_STORE).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function dbPut(key, data){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put({ key:key, data:data });
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function dbDelete(key){
    return dbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function migrateLegacyLocalStorage(){
    var oldKeys = [];
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(LEGACY_PREFIX)===0) oldKeys.push(k);
    }
    if (!oldKeys.length) return Promise.resolve();
    return Promise.all(oldKeys.map(function(k){
      try {
        var data = JSON.parse(localStorage.getItem(k));
        return dbPut(k, data).then(function(){ localStorage.removeItem(k); });
      } catch(e){ return Promise.resolve(); }
    }));
  }

      ballsWithOvers.filter(passesFilter).forEach(function(b){
        var o = outcomeMap[b.outcome], lz = lengthZoneFor(b.yPct), ln = lineLabel(b.xPct, bowler.hand);
        var dismissTxt = (b.outcome==="W" && b.dismissal) ? (" ("+b.dismissal+")") : "";
        html += '<div class="pm-ball-row"><span class="pm-ball-tag"><span class="pm-ball-swatch" style="background:'+o.color+'"></span>'+b.over+'.'+b.ballNo+' '+o.label+dismissTxt+' &mdash; '+lz.label+', '+ln+(hasWagon(b)?' &middot; shot logged':'')+'</span><button class="pm-x-btn" data-action="remove-ball" data-id="'+b.id+'">&times;</button></div>';
      });
      html += '</div></div>';
    } else {
      var wagonBalls = bowler.balls.filter(hasWagon).filter(passesFilter);
      var offCount = wagonBalls.filter(function(b){ return bowler.hand==="LHB" ? b.wagonX>=GW_CX : b.wagonX<GW_CX; }).length;
      var legCount = wagonBalls.length - offCount;
      var wRuns = wagonBalls.reduce(function(s,x){return s+outcomeMap[x.outcome].runs;},0);
      var wBoundaries = wagonBalls.filter(function(s){return s.outcome==="4"||s.outcome==="6";}).length;
      html += '<div class="pm-panel"><div class="pm-panel-title">Wagon wheel summary</div>';
      html += '<div class="pm-stat-grid">';
      [["Shots",wagonBalls.length],["Runs",wRuns],["Boundaries",wBoundaries],["Off side",offCount],["Leg side",legCount],["Wickets",wagonBalls.filter(function(s){return s.outcome==="W";}).length]].forEach(function(s){
        html += '<div class="pm-stat"><div class="pm-stat-val">'+s[1]+'</div><div class="pm-stat-label">'+s[0]+'</div></div>';
      });
      html += '</div></div>';

      html += '<div class="pm-panel"><div class="pm-panel-title">Delivery log</div>';
      if (bowler.balls.length===0) html += '<div style="font-size:12px;color:var(--text-dim)">No deliveries logged yet.</div>';
      html += '<div class="pm-ball-list">';
      ballsWithOvers.filter(passesFilter).forEach(function(b){
        var o = outcomeMap[b.outcome], lz = lengthZoneFor(b.yPct), ln = lineLabel(b.xPct, bowler.hand);
        var shotTxt = hasWagon(b) ? ((bowler.hand==="LHB" ? b.wagonX>=GW_CX : b.wagonX<GW_CX) ? "off side" : "leg side") : "no shot";
        var dismissTxt = (b.outcome==="W" && b.dismissal) ? (" ("+b.dismissal+")") : "";
        html += '<div class="pm-ball-row"><span class="pm-ball-tag"><span class="pm-ball-swatch" style="background:'+o.color+'"></span>'+b.over+'.'+b.ballNo+' '+o.label+dismissTxt+' &mdash; '+lz.label+', '+ln+' &middot; '+shotTxt+'</span><button class="pm-x-btn" data-action="remove-ball" data-id="'+b.id+'">&times;</button></div>';
      });
      html += '</div></div>';
    }

    if (state.showLoad){
      var keys = savedSessionsCache;
      html += '<div class="pm-modal-backdrop"><div class="pm-modal"><div class="pm-panel-title">Saved sessions</div><div class="pm-load-list">';
      if (keys.length===0) html += '<div style="font-size:12px;color:var(--text-dim)">Nothing saved yet.</div>';
      keys.forEach(function(rec){
        var d = rec.data || {};
        var count = Object.keys(d.bowlers||{}).length;
        html += '<div class="pm-load-row"><span>'+esc(d.date||"")+' &middot; '+count+' bowler'+(count===1?"":"s")+'</span><span style="display:flex;gap:6px;"><button class="pm-btn secondary" style="padding:8px 12px" data-action="load-session" data-key="'+esc(rec.key)+'">Load</button><button class="pm-x-btn" data-action="delete-session" data-key="'+esc(rec.key)+'">&#128465;</button></span></div>';
      });
      html += '</div><div style="margin-top:12px;text-align:right"><button class="pm-btn secondary" data-action="load-close">Close</button></div></div></div>';
    }

    app.innerHTML = html;

    var bowlerInput = document.getElementById("input-bowler");
    bowlerInput.addEventListener("input", function(){ cb().name = bowlerInput.value; });
    var dateInput = document.getElementById("input-date");
    dateInput.addEventListener("input", function(){ state.sessionDate = dateInput.value; });

    if (state.mode==="pitch"){
      var svg = document.getElementById("pitch-svg");
      svg.addEventListener("click", function(e){
        var svgRect = svg.getBoundingClientRect();
        var svgUnitX = ((e.clientX-svgRect.left)/svgRect.width)*VB_W_TOTAL - RULER_W;
        if (svgUnitX < 0) return;
        var xPct = clamp((svgUnitX/VB_W)*100, 0, 100);
        var yPct = clamp(((e.clientY-svgRect.top)/svgRect.height)*100, 0, 100);
        cb().balls.push({ id:uid(), xPct:xPct, yPct:yPct, wagonX:null, wagonY:null, outcome:"_none", dismissal:null, t:Date.now() });
        render();
      });
    } else if (pd && pd.stage==="mark-pitch"){
      var svg2 = document.getElementById("pitch-svg2");
      svg2.addEventListener("click", function(e){
        var svgRect = svg2.getBoundingClientRect();
        var svgUnitX = ((e.clientX-svgRect.left)/svgRect.width)*VB_W_TOTAL - RULER_W;
        if (svgUnitX < 0) return;
        var xPct = clamp((svgUnitX/VB_W)*100, 0, 100);
        var yPct = clamp(((e.clientY-svgRect.top)/svgRect.height)*100, 0, 100);
        state.pendingDelivery.xPct = xPct; state.pendingDelivery.yPct = yPct;
        state.pendingDelivery.stage = "awaiting-shot";
        render();
      });
    } else if (pd && pd.stage==="awaiting-shot"){
      var gsvg = document.getElementById("ground-svg");
      gsvg.addEventListener("click", function(e){
        var wrap = document.getElementById("combo-wrap");
        var svgRect = gsvg.getBoundingClientRect();
        var wrapRect = wrap.getBoundingClientRect();
        var gx = ((e.clientX-svgRect.left)/svgRect.width)*GW_SIZE;
        var gy = ((e.clientY-svgRect.top)/svgRect.height)*GW_SIZE;
        var dx = gx-GW_CX, dy = gy-GW_CY;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > GW_R){ var k = GW_R/dist; gx = GW_CX+dx*k; gy = GW_CY+dy*k; }
        state.pendingDelivery.wagonX = gx; state.pendingDelivery.wagonY = gy;
        state.pendingDelivery.stage = "outcome";
        state.pendingDelivery.px = e.clientX-wrapRect.left; state.pendingDelivery.py = e.clientY-wrapRect.top;
        state.pendingDelivery.wrapW = wrapRect.width; state.pendingDelivery.wrapH = wrapRect.height;
        render();
      });
    }
  }

  app.addEventListener("click", function(e){
    if (e.target.classList && e.target.classList.contains("pm-modal-backdrop")){
      state.showLoad = false; render(); return;
    }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action==="switch-bowler"){ state.currentBowlerId = el.getAttribute("data-id"); render(); }
    else if (action==="add-bowler"){
      var name = window.prompt("Bowler name? (add several at once separated by commas, e.g. Arjun, Priya, Dev)", "");
      if (name===null) return;
      var names = name.split(",").map(function(n){return n.trim();}).filter(function(n){return n;});
      if (names.length===0) names = ["Bowler "+(Object.keys(state.bowlers).length+1)];
      var lastId = null;
      names.forEach(function(n){
        var id = uid();
        state.bowlers[id] = { name: n, hand:"RHB", balls:[] };
        lastId = id;
      });
      state.currentBowlerId = lastId; render();
    }
    else if (action==="remove-bowler"){
      if (Object.keys(state.bowlers).length<=1) return;
      if (!confirm("Remove "+(cb().name||"this bowler")+" and their data?")) return;
      delete state.bowlers[state.currentBowlerId];
      state.currentBowlerId = Object.keys(state.bowlers)[0];
      render();
    }
    else if (action==="set-mode"){
      if (state.pendingDelivery){ state.status = "Cancelled the delivery in progress."; state.pendingDelivery = null; setTimeout(function(){ state.status=""; render(); }, 2000); }
      state.mode = el.getAttribute("data-mode"); render();
    }
    else if (action==="set-hand"){ cb().hand = el.getAttribute("data-hand"); render(); }
    else if (action==="set-view"){ state.viewMode = el.getAttribute("data-view"); render(); }
    else if (action==="set-over"){ var v = el.getAttribute("data-over"); state.overFilter = v==="all"?"all":Number(v); render(); }
    else if (action==="set-outcome-filter"){
      var f = el.getAttribute("data-filter");
      if (f==="all"){ FILTERABLE.forEach(function(id){ state.outcomeFilter[id] = true; }); }
      else { state.outcomeFilter[f] = !state.outcomeFilter[f]; if (!FILTERABLE.some(function(id){return state.outcomeFilter[id];})) state.outcomeFilter[f] = true; }
      render();
    }
    else if (action==="start-delivery"){ state.pendingDelivery = { xPct:null, yPct:null, wagonX:null, wagonY:null, dismissal:null, stage:"mark-pitch" }; render(); }
    else if (action==="cancel-delivery"){ state.pendingDelivery = null; render(); }
    else if (action==="skip-shot"){
      if (state.pendingDelivery && state.pendingDelivery.stage==="awaiting-shot"){
        var wrapEl = document.getElementById("combo-wrap");
        var r = wrapEl.getBoundingClientRect();
        state.pendingDelivery.stage = "outcome";
        state.pendingDelivery.px = r.width/2 - 93; state.pendingDelivery.py = r.height/2 - 60;
        state.pendingDelivery.wrapW = r.width; state.pendingDelivery.wrapH = r.height;
        render();
      }
    }
    else if (action==="commit-delivery"){
      var pd = state.pendingDelivery;
      if (pd && pd.stage==="outcome"){
        var outcomeId = el.getAttribute("data-outcome");
        if (outcomeId==="W"){
          pd.outcome = "W";
          pd.stage = "dismissal";
          render();
        } else {
          cb().balls.push({ id:uid(), xPct:pd.xPct, yPct:pd.yPct, wagonX:pd.wagonX, wagonY:pd.wagonY, outcome:outcomeId, dismissal:null, t:Date.now() });
          state.pendingDelivery = null;
          render();
        }
      }
    }
    else if (action==="commit-dismissal"){
      var pd2 = state.pendingDelivery;
      if (pd2 && pd2.stage==="dismissal"){
        cb().balls.push({ id:uid(), xPct:pd2.xPct, yPct:pd2.yPct, wagonX:pd2.wagonX, wagonY:pd2.wagonY, outcome:"W", dismissal:el.getAttribute("data-dismissal"), t:Date.now() });
        state.pendingDelivery = null;
        render();
      }
    }
    else if (action==="remove-ball"){ var id = el.getAttribute("data-id"); cb().balls = cb().balls.filter(function(b){return b.id!==id;}); render(); }
    else if (action==="undo"){ cb().balls = cb().balls.slice(0,-1); render(); }
    else if (action==="clear"){ if (cb().balls.length && confirm("Clear all balls for "+(cb().name||"this bowler")+"?")){ cb().balls = []; render(); } }
    else if (action==="save"){
      var anyNamed = Object.values(state.bowlers).some(function(b){return b.name && b.name.trim();});
      if (!anyNamed){ state.status = "Add at least one bowler name before saving."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); return; }
      var key = "pitchsession:"+state.sessionDate+":"+Date.now();
      var payload = { date: state.sessionDate, bowlers: state.bowlers, savedAt: Date.now() };
      state.status = "Saving…"; render();
      dbPut(key, payload).then(function(){
        state.status = "Session saved."; render(); setTimeout(function(){ state.status=""; render(); }, 2500);
      }).catch(function(){
        state.status = "Couldn't save — try again."; render(); setTimeout(function(){ state.status=""; render(); }, 2500);
      });
    }
    else if (action==="load-open"){
      state.showLoad = true; render();
      refreshSavedSessions().then(function(){ render(); });
    }
    else if (action==="load-close"){ state.showLoad = false; render(); }
    else if (action==="load-session"){
      var key = el.getAttribute("data-key");
      var rec = savedSessionsCache.find(function(r){ return r.key===key; });
      try {
        var data = rec ? rec.data : null;
        if (!data) throw new Error("not found");
        state.sessionDate = data.date || state.sessionDate;
        if (data.bowlers) {
          state.bowlers = data.bowlers;
          Object.values(state.bowlers).forEach(function(b){
            if (!b.balls) b.balls = [];
            b.balls.forEach(function(ball){ if (ball.wagonX===undefined) ball.wagonX=null; if (ball.wagonY===undefined) ball.wagonY=null; });
          });
        }
        else if (data.balls) { var id2 = uid(); state.bowlers = {}; state.bowlers[id2] = { name:data.bowler||"Bowler 1", hand:data.hand||"RHB", balls:data.balls }; }
        state.currentBowlerId = Object.keys(state.bowlers)[0];
        state.pendingDelivery = null; state.mode = "pitch";
        state.showLoad = false;
      } catch(err){ state.status = "Couldn't load that session."; }
      render();
    }
    else if (action==="delete-session"){
      var delKey = el.getAttribute("data-key");
      dbDelete(delKey).then(function(){ return refreshSavedSessions(); }).then(function(){ render(); });
    }
    else if (action==="export"){
      var payload = { date: state.sessionDate, bowlers: state.bowlers, exportedAt: new Date().toISOString() };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "pitchmap-session-"+state.sessionDate+".json";
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }
    else if (action==="share-image"){ shareCurrentChart(); }
    else if (action==="share-all"){ shareAllBowlers(); }
    else if (action==="print-report"){ printReport(); }
  });

  function loadSvgAsImage(svgString){
    return new Promise(function(resolve, reject){
      var blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){ resolve({ img:img, url:url }); };
      img.onerror = function(err){ reject(err); };
      img.src = url;
    });
  }

  function shareBlob(blob, fname){
    var file;
    try { file = new File([blob], fname, { type: "image/png" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Pitch Map", text: fname }).catch(function(){});
    } else {
      var dlUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = dlUrl; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(dlUrl);
    }
  }

  function shareCurrentChart(){
    var bowler = cb();
    var isCombined = state.mode==="combined";
    var svgString = isCombined
      ? groundSvgMarkup(bowler, bowler.balls, null, null, true)
      : pitchSvgMarkup(bowler, state.viewMode, bowler.balls, null, null, true);
    var chartW = isCombined ? GW_SIZE : VB_W_TOTAL;
    var chartH = isCombined ? GW_SIZE : VB_H;

    loadSvgAsImage(svgString).then(function(res){
      var scale = 2.5, padTop = 96, padSide = 20, padBottom = 24;
      var canvas = document.createElement("canvas");
      canvas.width = (chartW + padSide*2) * scale;
      canvas.height = (chartH + padTop + padBottom) * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0a1420";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#22c58b";
      ctx.font = "700 19px Poppins, sans-serif";
      ctx.fillText((bowler.name || "Bowler") + " — " + (isCombined ? "Outcomes & Wagon Wheel" : "Pitch Map"), padSide, 30);
      ctx.fillStyle = "#8b96a5";
      ctx.font = "500 11.5px Inter, sans-serif";
      ctx.fillText(state.sessionDate + "  ·  " + bowler.hand + "  ·  ProCoach OS", padSide, 48);

      ctx.fillStyle = "#eef2f6";
      ctx.font = "600 12.5px Inter, sans-serif";
      var st = statsFor(bowler.balls);
      if (isCombined){
        var wagonBalls = bowler.balls.filter(hasWagon);
        var wRuns = wagonBalls.reduce(function(s,x){return s+outcomeMap[x.outcome].runs;},0);
        ctx.fillText(wagonBalls.length + " shots  ·  " + wRuns + " runs off the bat", padSide, 70);
      } else {
        ctx.fillText(bowler.balls.length + " balls  ·  " + st.totalRuns + " runs  ·  " + st.wickets + " wkts  ·  econ " + st.economy.toFixed(1), padSide, 70);
      }

      ctx.drawImage(res.img, padSide, padTop, chartW, chartH);
      URL.revokeObjectURL(res.url);
      canvas.toBlob(function(blob){
        var fname = "pitchmap-" + (isCombined?"wagon-":"") + (bowler.name || "bowler").trim().toLowerCase().replace(/\s+/g, "-") + "-" + state.sessionDate + ".png";
        shareBlob(blob, fname);
      }, "image/png");
    }).catch(function(){ state.status = "Couldn't generate image."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); });
  }

  function shareAllBowlers(){
    var ids = Object.keys(state.bowlers);
    if (!ids.length) return;
    var aspect = VB_W_TOTAL / VB_H;
    var cellChartW = 168, cellChartH = Math.round(cellChartW / aspect);
    var headerH = 30, colGap = 16, rowGap = 22, padSide = 20, padTop = 64, padBottom = 24;
    var columns = ids.length > 1 ? 2 : 1;
    var rows = Math.ceil(ids.length / columns);
    var scale = 2.2;
    var canvasW = padSide*2 + columns*cellChartW + (columns-1)*colGap;
    var canvasH = padTop + rows*(headerH+cellChartH) + (rows-1)*rowGap + padBottom;

    Promise.all(ids.map(function(id){
      var b = state.bowlers[id];
      return loadSvgAsImage(pitchSvgMarkup(b, state.viewMode, b.balls, null, null, true)).then(function(res){ return { id:id, bowler:b, res:res }; });
    })).then(function(results){
      var canvas = document.createElement("canvas");
      canvas.width = canvasW * scale; canvas.height = canvasH * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0a1420"; ctx.fillRect(0,0,canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#22c58b";
      ctx.font = "700 20px Poppins, sans-serif";
      ctx.fillText("Full Session — Pitch Maps", padSide, 28);
      ctx.fillStyle = "#8b96a5";
      ctx.font = "500 11.5px Inter, sans-serif";
      ctx.fillText(state.sessionDate + "  ·  " + ids.length + " bowlers  ·  ProCoach OS", padSide, 46);

      results.forEach(function(r, i){
        var col = i % columns, row = Math.floor(i / columns);
        var x = padSide + col*(cellChartW+colGap);
        var y = padTop + row*(headerH+cellChartH+rowGap);
        var st = statsFor(r.bowler.balls);
        ctx.fillStyle = "#eef2f6";
        ctx.font = "700 12.5px Poppins, sans-serif";
        ctx.fillText(r.bowler.name || "Bowler", x, y+12);
        ctx.fillStyle = "#8b96a5";
        ctx.font = "500 9.5px Inter, sans-serif";
        ctx.fillText(r.bowler.balls.length+"b · "+st.totalRuns+"r · "+st.wickets+"w · econ "+st.economy.toFixed(1), x, y+24);
        ctx.drawImage(r.res.img, x, y+headerH, cellChartW, cellChartH);
        URL.revokeObjectURL(r.res.url);
      });

      canvas.toBlob(function(blob){
        shareBlob(blob, "pitchmap-session-" + state.sessionDate + ".png");
      }, "image/png");
    }).catch(function(){ state.status = "Couldn't generate the combined image."; render(); setTimeout(function(){ state.status=""; render(); }, 2500); });
  }

  function printReport(){
    var ids = Object.keys(state.bowlers);
    var container = document.getElementById("print-report");
    var html = "";
    ids.forEach(function(id){
      var b = state.bowlers[id];
      var st = statsFor(b.balls);
      var wagonBalls = b.balls.filter(hasWagon);
      var wRuns = wagonBalls.reduce(function(s,x){return s+outcomeMap[x.outcome].runs;},0);
      var pitchSvg = pitchSvgMarkup(b, "dots", b.balls, null, null, true);
      var groundSvg = groundSvgMarkup(b, b.balls, null, null, true);

      html += '<div class="pr-bowler">';
      html += '<div class="pr-head"><h1>'+esc(b.name||"Bowler")+' — Bowling Report</h1><div class="pr-meta">'+esc(state.sessionDate)+' &middot; '+b.hand+' &middot; ProCoach OS</div></div>';

      html += '<div class="pr-stats">';
      [["Total balls",b.balls.length],["Runs",st.totalRuns],["Wickets",st.wickets],["Economy",st.economy.toFixed(1)],["Dot ball %",st.dotPct.toFixed(0)+"%"],["Boundaries",st.boundaries]].forEach(function(s){
        html += '<div class="pr-stat"><b>'+s[1]+'</b>'+s[0]+'</div>';
      });
      html += '</div>';

      html += '<div class="pr-charts">'+pitchSvg+groundSvg+'</div>';

      html += '<div class="pr-section-title">Length breakdown</div>';
      html += printOutcomeColumnsTable(LENGTH_ZONES.map(function(z){ return { label:z.label, balls: b.balls.filter(function(ball){return lengthZoneFor(ball.yPct).id===z.id;}) }; }));

      var lineLabels = b.hand==="LHB" ? LINE_LABELS_LHB : LINE_LABELS_RHB;
      html += '<div class="pr-section-title">Line breakdown ('+(b.hand==="LHB"?"left-hand":"right-hand")+" batter's view)</div>";
      html += printOutcomeColumnsTable(lineLabels.map(function(label,i){ return { label:label, balls: b.balls.filter(function(ball){return lineZoneIndex(ball.xPct)===i;}) }; }));

      html += '<div class="pr-section-title">Delivery log</div><table class="pr-table"><tr><th>Ball</th><th>Outcome</th><th>Length</th><th>Line</th><th>Shot</th></tr>';
      withOvers(b.balls).forEach(function(ball){
        var o = outcomeMap[ball.outcome], lz = lengthZoneFor(ball.yPct), ln = lineLabel(ball.xPct, b.hand);
        var outcomeTxt = o.label + (ball.outcome==="W" && ball.dismissal ? " ("+ball.dismissal+")" : "");
        var shotTxt = hasWagon(ball) ? ((b.hand==="LHB" ? ball.wagonX>=GW_CX : ball.wagonX<GW_CX) ? "Off side" : "Leg side") : "—";
        html += '<tr><td>'+ball.over+'.'+ball.ballNo+'</td><td>'+esc(outcomeTxt)+'</td><td>'+lz.label+'</td><td>'+ln+'</td><td>'+shotTxt+'</td></tr>';
      });
      html += '</table>';
      html += '</div>';
    });
    container.innerHTML = html;
    setTimeout(function(){ window.print(); }, 60);
  }

  render();
  migrateLegacyLocalStorage().catch(function(){});
})();
</script>
</body>
</html>
